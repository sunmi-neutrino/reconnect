<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REConnect — HGAR Member Login</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Poppins", system-ui, sans-serif;
  background: #0B1F3A;
  color: #0F172A;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
}

/* ── Layout ── */
.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 100vh;
}
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: auto auto; }
  .context-panel { order: 2; }
  .auth-panel { order: 1; }
}

/* ── Left panel ── */
.context-panel {
  background: linear-gradient(135deg, #1B2166 0%, #8D5D8E 100%);
  padding: 52px 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.context-panel::before {
  content: "";
  position: absolute;
  top: -100px; right: -100px;
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 70%);
  pointer-events: none;
}
.context-panel::after {
  content: "";
  position: absolute;
  bottom: -80px; left: -80px;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(99,60,220,0.3) 0%, transparent 70%);
  pointer-events: none;
}
.context-panel > * { position: relative; z-index: 1; }

.cp-logo { margin-bottom: 32px; }
.cp-logo img { width: 168px; }

/* Co-brand logo lockup */
.cp-logo-lockup {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 36px;
}
.cp-logo-lockup img { display: block; }
.cp-logo-divider { font-size: 16px; color: rgba(255,255,255,0.35); line-height: 1; }

/* Welcome message */
.cp-welcome-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
  color: #fff; font-size: 11px; font-weight: 700;
  padding: 5px 14px; border-radius: 999px;
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 24px; align-self: flex-start;
}

.cp-headline {
  font-size: 36px; font-weight: 700; color: #fff;
  letter-spacing: -0.025em; line-height: 1.25;
  margin-bottom: 10px;
}
.cp-headline span { color: #fff; }

.cp-subline {
  font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.75;
  margin-bottom: 36px; max-width: 380px;
}

/* What to do once you're in */
.cp-section-title {
  font-size: 16px; font-weight: 700; color: #fff;
  margin-bottom: 16px;
}

.cp-checklist {
  display: flex; flex-direction: column; gap: 0;
  margin-bottom: 32px;
  background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px; padding: 6px 16px;
}
.cp-check-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 0;
}
.cp-check-icon {
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(16,185,129,0.25); border: 1.5px solid rgba(16,185,129,0.5);
  color: #6EE7B7; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.cp-check-text { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.5; }

/* Credentials box */
.cp-creds {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
  border-radius: 14px; padding: 20px 22px; margin-bottom: 0;
}
.cp-creds-title {
  font-size: 13px; font-weight: 700; color: #fff;
  text-align: center; margin-bottom: 16px;
}
.cp-creds-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
}
.cp-creds-row:last-child { border-bottom: none; padding-bottom: 0; }
.cp-creds-label { font-size: 12px; color: rgba(255,255,255,0.6); }
.cp-creds-value {
  font-size: 12.5px; font-weight: 700; color: #fff;
  background: rgba(255,255,255,0.15); padding: 3px 10px;
  border-radius: 6px; font-family: monospace;
}
.cp-creds-note {
  font-size: 11.5px; color: rgba(255,255,255,0.45); text-align: center;
  margin-top: 12px; font-style: italic;
}

/* Testimonial */
.cp-testimonial {
  margin-top: 32px; padding-top: 28px;
  border-top: 1px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; gap: 12px;
}
.cp-test-avas { display: flex; }
.cp-test-ava {
  width: 28px; height: 28px; border-radius: 50%;
  background-size: cover; background-position: center;
  border: 2px solid rgba(255,255,255,0.3); margin-left: -8px;
}
.cp-test-ava:first-child { margin-left: 0; }
.cp-test-text { font-size: 12.5px; color: rgba(255,255,255,0.65); }
.cp-test-text strong { color: #fff; font-weight: 600; }

/* Back to landing page link */
.cp-back-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 32px;
  font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.7);
  text-decoration: none;
}
.cp-back-link:hover { color: #fff; }

/* ── Auth panel (right) ── */
.auth-panel {
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 52px;
}
.auth-inner { width: 100%; max-width: 380px; }

.auth-logo { display: block; margin-bottom: 28px; }

/* Step containers */
.step { display: none; }
.step.active { display: block; }

/* Login step */
.auth-headline { font-size: 22px; font-weight: 700; color: #0F172A; letter-spacing: -0.02em; margin-bottom: 6px; line-height: 1.3; }
.auth-sub { font-size: 13.5px; color: #64748B; line-height: 1.6; margin-bottom: 6px; }

.login-contact { font-size: 12.5px; color: #64748B; text-align: center; margin-top: 18px; line-height: 1.6; }
.login-contact a { color: #2563EB; font-weight: 600; text-decoration: none; }
.login-contact a:hover { text-decoration: underline; }

.hgar-badge {
  display: inline-flex; align-items: center; gap: 7px;
  background: #EFF6FF; border: 1px solid #BFDBFE;
  color: #1D4ED8; font-size: 11px; font-weight: 700;
  padding: 5px 14px; border-radius: 999px;
  letter-spacing: 0.05em; text-transform: uppercase;
  margin-bottom: 20px;
}

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: #1e293b; margin-bottom: 5px; }
.field input {
  width: 100%; padding: 10px 14px; border: 1.5px solid #E5E8EE; border-radius: 8px;
  font-family: inherit; font-size: 13.5px; color: #0F172A;
  transition: border-color .15s; outline: none; background: #fff;
}
.field input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.field input::placeholder { color: #94a3b8; }

.forgot-link { font-size: 11.5px; font-weight: 500; color: #2563EB; text-decoration: none; }
.forgot-link:hover { text-decoration: underline; }

.submit-btn {
  width: 100%; padding: 13px; border: none; border-radius: 999px;
  background: #1D4ED8; color: #fff; font-family: inherit;
  font-size: 14.5px; font-weight: 700; cursor: pointer;
  transition: background .15s; margin-top: 8px; letter-spacing: -0.01em;
}
.submit-btn:hover { background: #1e40af; }
.submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 20px 0; color: #94a3b8; font-size: 12px;
}
.auth-divider::before, .auth-divider::after {
  content: ""; flex: 1; height: 1px; background: #E5E8EE;
}

.google-btn {
  width: 100%; padding: 11px; border: 1.5px solid #E5E8EE; border-radius: 999px;
  background: #fff; font-family: inherit; font-size: 13.5px; font-weight: 600;
  color: #1e293b; cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 10px; transition: border-color .15s;
}
.google-btn:hover { border-color: #94a3b8; }

.linkedin-btn {
  width: 100%; padding: 11px; border: 1.5px solid #E5E8EE; border-radius: 999px;
  background: #fff; font-family: inherit; font-size: 13.5px; font-weight: 600;
  color: #1e293b; cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 10px; transition: border-color .15s; margin-top: 10px;
}
.linkedin-btn:hover { border-color: #94a3b8; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">

const SvgIcon = ({ path, size = 16, strokeWidth = 1.9, fill = "none" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
    <path d={path} />
  </svg>
);

/* ─── Left panel ─── */
function ContextPanel() {
  return (
    <div className="context-panel">

      <div className="cp-logo-lockup">
        <img src="uploads/hgar-logo.svg" alt="HGAR" style={{ height:25 }} />
        <span className="cp-logo-divider">+</span>
        <img src="uploads/ReConnect_logo_final-white.svg" alt="REConnect" style={{ height:20 }} />
      </div>

      <div className="cp-headline">
        <span>REConnect Is Ready for You!</span>
      </div>
      <div className="cp-subline">
        Your REConnect account is live and ready to use.<br />
        Log in now to access your listings and marketing tools.
      </div>

      <div className="cp-section-title">What to do once you're in</div>

      <div className="cp-checklist">
        {[
          "Browse your active MLS listings — they're already loaded.",
          "Check your free Single Listing Website.",
          "Explore Canva templates and start creating marketing materials.",
        ].map((text, i) => (
          <div key={i} className="cp-check-item">
            <div className="cp-check-icon">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M5 12l5 5L20 7"/>
              </svg>
            </div>
            <div className="cp-check-text">{text}</div>
          </div>
        ))}
      </div>

      <div className="cp-testimonial">
        <div className="cp-test-avas">
          {[
            "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=60&auto=format",
            "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=60&auto=format",
            "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=60&auto=format",
            "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=60&auto=format",
          ].map((src, i) => (
            <div key={i} className="cp-test-ava" style={{ backgroundImage:`url(${src})` }}></div>
          ))}
        </div>
        <div className="cp-test-text">
          <strong>2,400+ agents</strong> already on REConnect
        </div>
      </div>

      <a href="https://reconnect-hgar.vercel.app/" className="cp-back-link">
        <SvgIcon path="M19 12H5M12 19l-7-7 7-7" size={14} strokeWidth={2.2} />
        Back to REConnect for HGAR
      </a>
    </div>
  );
}

/* ─── Login ─── */
function StepLogin() {
  const [loading, setLoading] = React.useState(false);
  const goToDashboard = () => { window.location.href = "Reconnect Phase1-V2.html"; };
  const handleSubmit = (e) => {
    e.preventDefault();
    setLoading(true);
    setTimeout(goToDashboard, 1200);
  };
  return (
    <div className="step active">
      <div className="auth-headline">Welcome to REConnect</div>
      <div className="auth-sub" style={{ marginBottom:28 }}>Sign in with your HGAR REConnect credentials to access your account. Your login credentials should be on the email you've received.</div>

      <form onSubmit={handleSubmit}>
        <div className="field">
          <label>Email address</label>
          <input type="email" placeholder="agent@email.com" defaultValue="agent@email.com" required />
        </div>
        <div className="field">
          <label style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            Password
            <a href="#" className="forgot-link">Forgot password?</a>
          </label>
          <input type="password" placeholder="••••••••" defaultValue="password123" required />
        </div>
        <button className="submit-btn" type="submit" disabled={loading}>
          {loading ? "Signing in…" : "Log in to REConnect →"}
        </button>

        <div className="auth-divider">or</div>

        <button type="button" className="google-btn" onClick={() => { setLoading(true); setTimeout(goToDashboard, 1000); }}>
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <button type="button" className="linkedin-btn" onClick={() => { setLoading(true); setTimeout(goToDashboard, 1000); }}>
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#0A66C2" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/>
          </svg>
          Continue with LinkedIn
        </button>
      </form>

      <div className="login-contact">
        Can't find your login info? <a href="https://reconnect-hgar.vercel.app/#contact">please contact us</a>.
      </div>
    </div>
  );
}

/* ─── Main App ─── */
function HGARLoginApp() {
  return (
    <div className="layout">
      <ContextPanel />
      <div className="auth-panel">
        <div className="auth-inner">
          <div className="auth-logo">
            <img src="uploads/ReConnect_logo_final.svg" alt="REConnect" style={{ width:180, marginLeft:"-11px" }} />
          </div>
          <StepLogin />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HGARLoginApp />);
</script>
</body>
</html>
